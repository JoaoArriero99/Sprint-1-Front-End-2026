    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a class="logo" href="index.html">Sprint 1-Turma do Bem</a>
                <ul>
                    <li><a class="ativo" href="index.html">Página Inicial</a></li>

    <main class="centralizado">
        <h1>Fale Conosco</h1>
        <p>Se tiver alguma sugestão para o nosso projeto, fique a vontade para nos ajudar:</p>

        <article class="conteudo">
            <div class="formulario">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
            </div>

            <div class="formulario">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite o seu E-mail">
            </div>

            <div class="formulario">
                <label for="mensagem">Mensagem</label>
                <input type="mensagem" id="mensagem" name="mensagem" placeholder="Escreva a sua mensagem aqui!">
            </div>

            <button type="submit">Eviar Mensagem</button>
        </article>
    </main>

    <footer>
        <div class="contato">
            <h3>Contato</h3>
            <p>Email</p>
            <p>Telefone</p>
        </div>
        <div class="rodape">
            <h3>Redes Sociais</h3>
            <img src="./Imagens/—Pngtree—instagram logo icon vector_3588821.png" alt="Instagram">
