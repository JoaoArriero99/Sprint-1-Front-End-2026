<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/contato.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Página Inicial</a></li>
                <li><a href="./integrantes.html">Integrantes</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <li><a href="./faq.html">FAQ</a></li>
                <li><a href="./contato.html">Contato</a></li>
            </ul>
            <input type="text" placeholder="Pesquisar">
        </nav>
    </header>

    <main>
        <section class="agrupa-formulario">
            <h1>Fale Conosco</h1>
            <h2>Se tiver alguma sugestão para o nosso projeto, fique a vontade para nos ajudar:</h2>

            <div class="centraliza-formulario">
                <form action="">
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
                    </div>

                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Digite o seu E-mail">
                    </div>

                    <div>
                        <label for="mensagem">Mensagem</label>
                        <input type="message" id="mensagem" name="mensagem" placeholder="Escreva a sua mensagem aqui!">
                    </div>

                    <button type="submit">Eviar Mensagem</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="contato">
            <h2>Contatos</h2>
            <h3>Email: contato@improve.com.br </h3>
            <h3>Telefone: 11 9999-9999 </h3>
            <p>&copy;2026 FIAP Turma do Bem </p>
        </div>
    </footer>
</body>

</html>
